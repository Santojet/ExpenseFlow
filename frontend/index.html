<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="ExpenseFlow Pro - Enterprise Expense & Payroll Management" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/jpeg" href="/app-icon.jpg" />
    <title>ExpenseFlow Pro</title>
  </head>

  <body>
    <div id="root">
      <div id="initial-loader" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #94a3b8; font-family: system-ui, sans-serif; padding: 20px;">
        <div style="text-align: center; max-width: 360px;">
          <div style="font-size: 26px; font-weight: 700; color: #6366f1; margin-bottom: 8px;">ExpenseFlow PRO</div>
          <div style="font-size: 14px; opacity: 0.8; margin-bottom: 16px;">Loading application...</div>
          <div id="loader-fallback" style="display: none; margin-top: 16px;">
            <p style="font-size: 12px; color: #f87171; margin-bottom: 10px;">New version available or network delay detected.</p>
            <button onclick="clearCacheAndReload()" style="background: #6366f1; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; box-shadow: 0 4px 12px rgba(99,102,241,0.4);">
              ↻ Refresh Application
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      function clearCacheAndReload() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var name of names) caches.delete(name);
          });
        }
        window.location.reload(true);
      }

      // Show refresh button if React initialization is delayed past 3 seconds
      setTimeout(function() {
        var loader = document.getElementById('initial-loader');
        var fallback = document.getElementById('loader-fallback');
        if (loader && fallback) {
          fallback.style.display = 'block';
        }
      }, 3000);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update();
          }).catch(function() {});
        });
      }
    </script>
  </body>
</html>
